<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #334155;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 36px 32px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.1);
      max-width: 320px;
      width: 90%;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title  { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .sub    { font-size: 12px; color: #94a3b8; }
    .ok     { font-size: 32px; margin-bottom: 12px; }
    .error  { color: #dc2626; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>

<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <div class="title" id="title">Memproses login…</div>
  <div class="sub"   id="sub">Halaman ini akan tertutup otomatis</div>
</div>

<!-- Supabase JS — pakai URL yang sama dengan index.html -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL      = "https://zdfxcxkgmksaeigyuibe.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkZnhjeGtnbWtzYWVpZ3l1aWJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3Mjc0NjAsImV4cCI6MjA5MjMwMzQ2MH0.baUlaWNvN3wMKHL05E71aSxedjKvWhfVQXHGXraWyVU";

  function setUI(icon, title, sub) {
    const sp = document.getElementById("spinner");
    const ic = document.getElementById("icon");
    const t  = document.getElementById("title");
    const s  = document.getElementById("sub");
    if (sp) sp.style.display = "none";
    if (icon && !ic) {
      const d = document.createElement("div");
      d.id = "icon"; d.className = "ok"; d.textContent = icon;
      document.getElementById("card").prepend(d);
    }
    if (t) t.textContent = title;
    if (s) s.textContent = sub;
  }

  function sendToParent(payload) {
    if (window.opener) {
      window.opener.postMessage(
        { type: "AUTH_CALLBACK", ...payload },
        window.location.origin
      );
    }
    // Tutup popup setelah 800ms (beri waktu postMessage terkirim)
    setTimeout(() => window.close(), 800);
  }

  async function handleCallback() {
    try {
      const cl = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // Supabase v2 otomatis exchange ?code= dari URL menjadi session
      // Cukup panggil getSession() setelah client dibuat
      const { data: { session }, error } = await cl.auth.getSession();

      if (error) {
        console.error("auth-callback: getSession error:", error.message);
        setUI("❌", "Login gagal", error.message);
        sendToParent({ error: error.message, session: null });
        return;
      }

      if (!session) {
        // Coba exchangeCodeForSession manual jika getSession belum jalan
        const params = new URLSearchParams(window.location.search);
        const code   = params.get("code");
        if (code) {
          const { data, error: exchErr } = await cl.auth.exchangeCodeForSession(code);
          if (exchErr || !data?.session) {
            setUI("❌", "Login gagal", exchErr?.message || "Session tidak ditemukan");
            sendToParent({ error: exchErr?.message || "no session", session: null });
            return;
          }
          setUI("✅", "Login berhasil!", "Menutup jendela…");
          sendToParent({ session: data.session, error: null });
          return;
        }

        setUI("❌", "Login gagal", "Tidak ada session atau code di URL");
        sendToParent({ error: "no session", session: null });
        return;
      }

      // Session berhasil
      setUI("✅", "Login berhasil!", "Menutup jendela…");
      sendToParent({ session, error: null });

    } catch (e) {
      console.error("auth-callback exception:", e.message);
      setUI("❌", "Terjadi kesalahan", e.message);
      sendToParent({ error: e.message, session: null });
    }
  }

  // Jalankan setelah DOM siap
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", handleCallback);
  } else {
    handleCallback();
  }

})();
</script>
</body>
</html>
